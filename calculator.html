<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多功能計算機</title>
<style>
  /* 整體頁面：置中、柔和背景 */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef2f7;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }

  /* 計算機外框 */
  .calc {
    width: 340px;
    padding: 20px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
    color: #333;
  }

  /* ===== 分頁切換列 ===== */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  /* 顯示區：上面是算式，下面是結果 */
  .screen {
    background: #1f2937;
    color: #ffffff;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 90px;
    overflow: hidden;
  }
  .expression {
    font-size: 24px;
    color: #9ca3af;
    min-height: 32px;
    word-break: break-all;
  }
  .result {
    font-size: 44px;
    font-weight: bold;
    margin-top: 6px;
    word-break: break-all;
  }

  /* 按鈕排列：4 欄格線 */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 68px;
    font-size: 30px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #e5e7eb;
    color: #111827;
    transition: transform 0.05s, filter 0.15s;
  }
  button:hover  { filter: brightness(0.95); }
  button:active { transform: scale(0.95); }

  /* 運算符號、清除、等於使用不同顏色，方便辨識 */
  .op    { background: #f59e0b; color: #ffffff; }
  .clear { background: #ef4444; color: #ffffff; }
  .equal { background: #10b981; color: #ffffff; }

  /* 清除按鈕佔 2 欄、等於按鈕佔 2 欄 */
  .wide { grid-column: span 2; }

  /* ===== 分頁按鈕（計算機／單位換算、重量／面積／匯率）===== */
  .tab {
    height: 56px;
    font-size: 24px;
  }
  .tab.active {
    background: #3b82f6;
    color: #ffffff;
  }

  /* ===== 單位換算頁面 ===== */
  .cats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .label {
    font-size: 22px;
    font-weight: bold;
    color: #374151;
    margin: 12px 0 6px;
  }
  /* 數字輸入框與下拉選單：字體放大，方便閱讀 */
  .field {
    width: 100%;
    box-sizing: border-box;
    height: 60px;
    font-size: 28px;
    padding: 0 12px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    background: #ffffff;
    color: #111827;
  }
  .field:focus { outline: none; border-color: #3b82f6; }
  .swap {
    width: 100%;
    margin-top: 14px;
    height: 56px;
    font-size: 24px;
    background: #f59e0b;
    color: #ffffff;
  }
  /* 換算結果顯示區：同時顯示「換算前」與「換算後」 */
  .conv-screen {
    background: #1f2937;
    color: #ffffff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 16px;
  }
  .conv-row { margin: 6px 0; }
  .conv-tag {
    font-size: 20px;
    color: #9ca3af;
  }
  .conv-value {
    font-size: 36px;
    font-weight: bold;
    word-break: break-all;
  }
  .conv-unit {
    font-size: 26px;
    color: #fbbf24;
    margin-left: 6px;
  }
  .rate-note {
    font-size: 18px;
    color: #b45309;
    margin-top: 12px;
    text-align: center;
  }

  /* ===== 計算歷史紀錄 ===== */
  .history {
    margin-top: 16px;
    border-top: 2px solid #e5e7eb;
    padding-top: 12px;
  }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .history-title {
    font-size: 22px;
    font-weight: bold;
    color: #374151;
  }
  /* 清除紀錄按鈕：比一般按鈕小一點，但字仍然清楚 */
  .history-clear {
    height: 44px;
    padding: 0 16px;
    font-size: 20px;
    background: #ef4444;
    color: #ffffff;
  }
  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 260px;      /* 最多 10 筆，超過高度就可捲動 */
    overflow-y: auto;
  }
  .history-item {
    background: #f3f4f6;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 8px;
    text-align: right;
    word-break: break-all;
  }
  .history-expr   { font-size: 20px; color: #6b7280; }
  .history-result { font-size: 28px; font-weight: bold; color: #111827; }
  .history-empty {
    font-size: 20px;
    color: #9ca3af;
    text-align: center;
    padding: 12px 0;
  }

  /* 目前沒被選到的分頁先隱藏 */
  .hidden { display: none; }
</style>
</head>
<body>

<div class="calc">
  <div class="title">多功能計算機</div>

  <!-- 分頁切換列 -->
  <div class="tabs">
    <button class="tab active" id="tabCalc" onclick="showTab('calc')">計算機</button>
    <button class="tab" id="tabConv" onclick="showTab('conv')">單位換算</button>
  </div>

  <!-- ========== 分頁一：四則運算計算機（原本功能，完整保留）========== -->
  <div id="pageCalc">
    <!-- 顯示區 -->
    <div class="screen">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- 按鈕區 -->
    <div class="buttons">
      <button onclick="pressNumber('7')">7</button>
      <button onclick="pressNumber('8')">8</button>
      <button onclick="pressNumber('9')">9</button>
      <button class="op" onclick="pressOperator('÷')">÷</button>

      <button onclick="pressNumber('4')">4</button>
      <button onclick="pressNumber('5')">5</button>
      <button onclick="pressNumber('6')">6</button>
      <button class="op" onclick="pressOperator('×')">×</button>

      <button onclick="pressNumber('1')">1</button>
      <button onclick="pressNumber('2')">2</button>
      <button onclick="pressNumber('3')">3</button>
      <button class="op" onclick="pressOperator('－')">－</button>

      <button onclick="pressNumber('0')">0</button>
      <button class="clear" onclick="clearAll()">清除</button>
      <button class="op" onclick="pressOperator('＋')">＋</button>

      <button class="equal wide" style="grid-column: span 4;" onclick="calculate()">＝ 等於</button>
    </div>

    <!-- 計算歷史紀錄：最新的一筆在最上面，最多 10 筆 -->
    <div class="history">
      <div class="history-head">
        <div class="history-title">計算紀錄</div>
        <button class="history-clear" onclick="clearHistory()">清除紀錄</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <!-- ========== 分頁二：單位換算 ========== -->
  <div id="pageConv" class="hidden">
    <!-- 換算類別：重量／面積／匯率 -->
    <div class="cats">
      <button class="tab active" id="cat-weight" onclick="setCategory('weight')">重量</button>
      <button class="tab" id="cat-area" onclick="setCategory('area')">面積</button>
      <button class="tab" id="cat-money" onclick="setCategory('money')">匯率</button>
    </div>

    <div class="label">輸入數值</div>
    <input class="field" id="amount" type="number" inputmode="decimal" value="1" oninput="convert()">

    <div class="label">從（換算前單位）</div>
    <select class="field" id="fromUnit" onchange="convert()"></select>

    <div class="label">換成（換算後單位）</div>
    <select class="field" id="toUnit" onchange="convert()"></select>

    <button class="swap" onclick="swapUnits()">⇅ 互換單位</button>

    <!-- 結果區：同時顯示換算前與換算後 -->
    <div class="conv-screen">
      <div class="conv-row">
        <div class="conv-tag">換算前</div>
        <span class="conv-value" id="beforeValue">1</span><span class="conv-unit" id="beforeUnit"></span>
      </div>
      <div class="conv-row">
        <div class="conv-tag">換算後</div>
        <span class="conv-value" id="afterValue">0</span><span class="conv-unit" id="afterUnit"></span>
      </div>
    </div>
    <!-- 只在「匯率」類別顯示的提醒 -->
    <div class="rate-note hidden" id="rateNote">※ 匯率為練習用示範數值，實際請以銀行公告為準</div>
  </div>
</div>

<script>
  // ===== 分頁切換：計算機／單位換算 =====
  function showTab(name) {
    const isCalc = (name === "calc");
    document.getElementById("pageCalc").classList.toggle("hidden", !isCalc);
    document.getElementById("pageConv").classList.toggle("hidden", isCalc);
    document.getElementById("tabCalc").classList.toggle("active", isCalc);
    document.getElementById("tabConv").classList.toggle("active", !isCalc);
  }

  // ==================================================
  //  分頁一：四則運算計算機（程式與原本相同）
  // ==================================================

  // ===== 狀態變數 =====
  let expression = "";    // 目前輸入的算式，例如 "12＋3×4"
  let justCalculated = false; // 是否剛按過等於（用來決定下一次輸入要不要重新開始）

  const expressionEl = document.getElementById("expression");
  const resultEl = document.getElementById("result");

  // 判斷最後一個字元是不是運算符號
  function endsWithOperator() {
    return /[＋－×÷]$/.test(expression);
  }

  // 更新畫面：上方顯示算式，下方顯示目前輸入的數字或結果
  function updateScreen(resultText) {
    expressionEl.textContent = expression;
    resultEl.textContent = resultText;
  }

  // ===== 按下數字 =====
  function pressNumber(n) {
    // 剛算完又按數字，就重新開始新的算式
    if (justCalculated) {
      expression = "";
      justCalculated = false;
    }
    // 避免出現 "05" 這種開頭多餘的 0
    if (/(^|[＋－×÷])0$/.test(expression)) {
      expression = expression.slice(0, -1);
    }
    expression += n;
    // 結果區顯示「目前正在輸入的那個數字」
    const currentNumber = expression.split(/[＋－×÷]/).pop();
    updateScreen(currentNumber);
  }

  // ===== 按下運算符號 =====
  function pressOperator(op) {
    // 算式是空的就不處理
    if (expression === "") return;
    // 剛算完按運算符號：接著用上一次的結果繼續算（expression 已是結果）
    justCalculated = false;
    // 連按兩次運算符號：後一個取代前一個
    if (endsWithOperator()) {
      expression = expression.slice(0, -1);
    }
    expression += op;
    updateScreen(op);
  }

  // ===== 清除 =====
  function clearAll() {
    expression = "";
    justCalculated = false;
    updateScreen("0");
  }

  // ===== 計算（先乘除、後加減）=====
  function calculate() {
    if (expression === "") return;
    // 結尾是運算符號就先拿掉，例如 "5＋" 變成 "5"
    if (endsWithOperator()) {
      expression = expression.slice(0, -1);
    }

    // 1. 把算式拆成「數字」與「符號」的陣列
    const parts = expression.split(/([＋－×÷])/);  // 例如 ["12","＋","3","×","4"]
    const nums = [];  // 數字
    const ops = [];   // 符號
    parts.forEach(function (p, i) {
      if (i % 2 === 0) nums.push(Number(p));
      else ops.push(p);
    });

    // 2. 第一輪：先處理乘法和除法
    for (let i = 0; i < ops.length; ) {
      if (ops[i] === "×" || ops[i] === "÷") {
        if (ops[i] === "÷" && nums[i + 1] === 0) {
          // 除以 0 顯示錯誤訊息
          expressionEl.textContent = expression + " =";
          resultEl.textContent = "不能除以 0";
          expression = "";
          justCalculated = true;
          return;
        }
        const value = ops[i] === "×" ? nums[i] * nums[i + 1] : nums[i] / nums[i + 1];
        nums.splice(i, 2, value); // 用計算結果取代這兩個數字
        ops.splice(i, 1);         // 移除已處理的符號
      } else {
        i++;
      }
    }

    // 3. 第二輪：由左到右處理加法和減法
    let total = nums[0];
    for (let i = 0; i < ops.length; i++) {
      total = ops[i] === "＋" ? total + nums[i + 1] : total - nums[i + 1];
    }

    // 4. 修正小數誤差（例如 0.1+0.2），最多保留 10 位小數
    total = Math.round(total * 1e10) / 1e10;

    // 5. 把這次的算式和結果存進歷史紀錄（除以 0 的錯誤不會走到這裡，所以不會被記錄）
    addHistory(expression, total);

    // 6. 顯示結果；算式變成結果，方便接著繼續計算
    expressionEl.textContent = expression + " =";
    resultEl.textContent = total;
    expression = String(total);
    justCalculated = true;
  }

  // ==================================================
  //  計算歷史紀錄（最多保留 10 筆）
  // ==================================================

  const MAX_HISTORY = 10;   // 最多保留幾筆
  let historyData = [];     // 每一筆長這樣：{ expr: "12＋3×4", result: 24 }
  const historyListEl = document.getElementById("historyList");

  // 新增一筆紀錄：放在最前面，超過 10 筆就丟掉最舊的
  function addHistory(expr, result) {
    historyData.unshift({ expr: expr, result: result });
    if (historyData.length > MAX_HISTORY) {
      historyData.pop();    // 移除最後面（最舊）的一筆
    }
    renderHistory();
  }

  // 清除所有紀錄
  function clearHistory() {
    historyData = [];
    renderHistory();
  }

  // 把 historyData 畫到畫面上的列表
  function renderHistory() {
    // 沒有紀錄時，顯示提示文字
    if (historyData.length === 0) {
      historyListEl.innerHTML = '<li class="history-empty">還沒有計算紀錄</li>';
      return;
    }
    let html = "";
    historyData.forEach(function (h) {
      html += '<li class="history-item">' +
                '<div class="history-expr">' + h.expr + ' =</div>' +
                '<div class="history-result">' + h.result + '</div>' +
              '</li>';
    });
    historyListEl.innerHTML = html;
  }

  // 一開始先畫出「還沒有計算紀錄」
  renderHistory();

  // ==================================================
  //  分頁二：單位換算（資料來自「台灣常用換算表」）
  // ==================================================

  // 每個單位的 v 是「1 個該單位 = 多少基準單位」
  //   重量基準：公克；面積基準：平方公尺；匯率基準：新台幣
  // def 是切換類別時預設選的「換算前／換算後」單位位置
  const UNIT_DATA = {
    weight: {
      list: [
        { name: "公克",     v: 1 },
        { name: "公斤",     v: 1000 },
        { name: "台斤",     v: 600 },   // 1 台斤 = 600 公克
        { name: "台兩",     v: 37.5 }   // 1 台兩 = 37.5 公克
      ],
      def: [2, 0]   // 預設：台斤 → 公克
    },
    area: {
      list: [
        { name: "平方公尺", v: 1 },
        { name: "坪",       v: 3.3058 },   // 1 坪 = 3.3058 平方公尺
        { name: "分地",     v: 969.917 },  // 1 分地 = 969.917 平方公尺
        { name: "甲",       v: 9699.17 }   // 1 甲 = 9699.17 平方公尺（10 分地）
      ],
      def: [1, 0]   // 預設：坪 → 平方公尺
    },
    money: {
      list: [
        { name: "新台幣 TWD", v: 1 },
        { name: "美元 USD",   v: 32.0 },   // 練習用示範匯率
        { name: "日圓 JPY",   v: 0.21 },
        { name: "歐元 EUR",   v: 35.0 },
        { name: "人民幣 CNY", v: 4.4 }
      ],
      def: [1, 0]   // 預設：美元 → 新台幣
    }
  };

  let currentCategory = "weight";  // 目前選擇的換算類別

  const amountEl   = document.getElementById("amount");
  const fromEl     = document.getElementById("fromUnit");
  const toEl       = document.getElementById("toUnit");

  // ===== 切換換算類別：重新填入下拉選單的單位 =====
  function setCategory(cat) {
    currentCategory = cat;

    // 更新三個類別按鈕的選取狀態
    ["weight", "area", "money"].forEach(function (c) {
      document.getElementById("cat-" + c).classList.toggle("active", c === cat);
    });

    // 重新建立「換算前／換算後」兩個下拉選單的選項
    const data = UNIT_DATA[cat];
    let html = "";
    data.list.forEach(function (u, i) {
      html += '<option value="' + i + '">' + u.name + "</option>";
    });
    fromEl.innerHTML = html;
    toEl.innerHTML = html;
    fromEl.value = data.def[0];
    toEl.value = data.def[1];

    // 只有匯率類別才顯示「練習用匯率」提醒
    document.getElementById("rateNote").classList.toggle("hidden", cat !== "money");

    convert();
  }

  // ===== 互換「換算前」與「換算後」的單位 =====
  function swapUnits() {
    const temp = fromEl.value;
    fromEl.value = toEl.value;
    toEl.value = temp;
    convert();
  }

  // ===== 進行換算並更新畫面 =====
  function convert() {
    const list = UNIT_DATA[currentCategory].list;
    const from = list[Number(fromEl.value)];
    const to   = list[Number(toEl.value)];

    // 單位名稱：換算前與換算後都要顯示
    document.getElementById("beforeUnit").textContent = from.name;
    document.getElementById("afterUnit").textContent  = to.name;

    // 沒輸入（或輸入不是數字）時，提示使用者
    const raw = amountEl.value;
    if (raw === "" || isNaN(Number(raw))) {
      document.getElementById("beforeValue").textContent = "－";
      document.getElementById("afterValue").textContent  = "請輸入數字";
      return;
    }
    const amount = Number(raw);

    // 換算公式：先換成基準單位，再換成目標單位
    const result = amount * from.v / to.v;

    // 規則：結果四捨五入到小數點後 2 位
    const rounded = Math.round((result + Number.EPSILON) * 100) / 100;

    // 加上千分位逗號，並固定顯示 2 位小數
    document.getElementById("beforeValue").textContent =
      amount.toLocaleString("zh-TW", { maximumFractionDigits: 10 });
    document.getElementById("afterValue").textContent =
      rounded.toLocaleString("zh-TW", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // 一開始先載入「重量」類別
  setCategory("weight");
</script>

</body>
</html>
